# ==============================================================================
# Configuración Nginx para Bus T14 Aragón (PWA Estática)
# Despliegue en Sandbox TrueNAS SCALE (Debian 12 LXC)
# Ruta del archivo en Sandbox: /etc/nginx/sites-available/bus.rarabala.com
# Enlace simbólico: ln -s /etc/nginx/sites-available/bus.rarabala.com /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 8080;
    listen [::]:8080;

    # Dominio de Cloudflare Tunnel
    server_name bus.rarabala.com;

    # Directorio físico en Sandbox (montado sobre ZFS /mnt/DataFast/apps/sandbox/projects/static/bus-horarios)
    root /projects/static/bus-horarios;
    index index.html;

    # Compresión Gzip para optimizar carga PWA
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Rutas principales
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Service Worker (CRÍTICO: No cachear para permitir actualizaciones inmediatas)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 3. Web App Manifest
    location = /manifest.json {
        types {
            application/manifest+json json;
        }
        add_header Cache-Control "public, max-age=3600";
    }

    # 4. Assets estáticos (CSS, JS, iconos, SVG)
    location ~* \.(?:css|js|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 5. Seguridad: Bloquear carpetas y archivos ocultos (.git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 6. Seguridad: Bloquear archivos internos del repositorio
    location ~* (package\.json|package-lock\.json|server\.js|generate_assets\.py|GEMINI\.md|\.md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
